# Include this exact-match location before the general /api/ proxy location on
# both api.printa.co.zm and api.printa.cloud HTTP/HTTPS virtual hosts.
location = /api/v1/assets/guest-upload {
    client_max_body_size 21m;
    limit_req zone=printa_guest_upload burst=10 nodelay;
    limit_req_status 429;
    limit_conn printa_guest_upload_conn 2;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
