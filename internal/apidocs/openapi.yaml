    parameters: [ { $ref: '#/components/parameters/ID' } ]
    patch:
      tags: [Administration]
      summary: Update vendor status
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorStatus' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/orders:
    get:
      tags: [Administration]
      summary: List orders across the platform
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/orders/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Administration]
      summary: Get an order across the platform
      x-required-roles: [ADMIN]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/subscriptions:
    get:
      tags: [Administration]
      summary: List subscriptions across the platform
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/audit-logs:
    get:
      tags: [Administration]
      summary: List platform audit log entries
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: admin_id
          in: query
          schema: { type: string, format: uuid }
        - name: target_type
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the authenticated user
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [UNREAD, READ, DISMISSED] }
        - name: type
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Notifications]
      summary: Create a notification
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationCreate' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count for the authenticated user
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read for the authenticated user
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Notifications]
      summary: Get a notification
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Notifications]
      summary: Delete a notification for the authenticated user
      responses:
        '204': { description: Notification deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notifications/{id}/read:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/{id}/dismiss:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [Notifications]
      summary: Dismiss a notification
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/bulk:
    post:
      tags: [Notifications]
      summary: Create the same notification for multiple recipients
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationBulkCreate' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/comms/send:
    post:
      tags: [Communications]
      summary: Send an external communication
      description: Available to authenticated vendor and administrator users.
      x-required-roles: [VENDOR, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunicationSend' }
      responses:
        '200':
          description: Communication delivery result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/comms/logs:
    get:
      tags: [Communications]
      summary: List communication delivery logs
      x-required-roles: [ADMIN]
      parameters:
        - name: channel
          in: query
          schema: { type: string, enum: [EMAIL, SMS, PUSH, WHATSAPP] }
        - name: recipient_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/comms/logs/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Communications]
      summary: Get a communication delivery log
      x-required-roles: [ADMIN]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StoreID:
      name: store_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VendorID:
      name: vendor_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerID:
      name: customer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderNumber:
      name: number
      in: path
      required: true
      schema: { type: string }
    InvoiceNumber:
      name: number
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Role:
      name: role
      in: query
      schema: { type: string, enum: [ADMIN, VENDOR, STAFF, CASHIER, CUSTOMER] }
    OAuthMode:
      name: mode
      in: query
      schema: { type: string }
    RedirectURI:
      name: redirect_uri
      in: query
      schema: { type: string, format: uri }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A caller-generated key used to safely retry an idempotent operation.
      schema: { type: string, maxLength: 255 }
  responses:
    ObjectResponse:
      description: Successful object response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericObject' }
    ArrayResponse:
      description: Successful collection response
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/GenericObject' }
    ObjectCreated:
      description: Resource created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericObject' }
    BadRequest:
      description: Invalid request body, query parameter, or state transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, expired, or inactive JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated caller lacks the required role or resource access
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A duplicate or conflicting resource state exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    VendorPolicyConsentStatus:
      type: object
      required: [required_policies, accepted_policy_slugs, acceptance_required]
      properties:
        required_policies:
          type: array
          items: { $ref: '#/components/schemas/VendorPolicy' }
        accepted_policy_slugs:
          type: array
          items: { type: string }
        acceptance_required: { type: boolean }
    VendorPolicy:
      type: object
      required: [id, slug, version, title, summary, status, required_for_vendor]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, enum: [vendor-terms, vendor-privacy-notice, vendor-acceptable-use] }
        version: { type: string }
        title: { type: string }
        summary: { type: string }
        status: { type: string, enum: [PUBLISHED] }
        required_for_vendor: { type: boolean }
        document_url: { type: string }
        effective_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
    VendorPolicyAcceptanceRequest:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          minItems: 1
          items:
            type: object
            required: [slug, version]
            properties:
              slug: { type: string }
              version: { type: string }
    WalletOverview:
      type: object
      required: [entries, withdrawals]
      properties:
        account:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WalletAccount' }]
        balance:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WalletBalance' }]
        entries:
          type: array
          items: { $ref: '#/components/schemas/WalletLedgerEntry' }
        withdrawals:
          type: array
          items: { $ref: '#/components/schemas/WalletWithdrawalRequest' }
    WalletAccount:
      type: object
      required: [id, vendor_id, currency, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        currency: { type: string, example: ZMW }
        state: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, CLOSED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }
    WalletBalance:
      type: object
      required: [wallet_account_id, currency, available_minor, pending_minor, held_minor, calculated_at]
      properties:
        wallet_account_id: { type: string, format: uuid }
        currency: { type: string, example: ZMW }
        available_minor: { type: integer, format: int64, description: Amount in the currency's minor unit. }
        pending_minor: { type: integer, format: int64, description: Amount in the currency's minor unit. }
        held_minor: { type: integer, format: int64, description: Amount in the currency's minor unit. }
        calculated_at: { type: string, format: date-time }
    WalletLedgerEntry:
      type: object
      required: [id, journal_id, entry_type, ledger_account, amount_minor, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        journal_id: { type: string, format: uuid }
        wallet_account_id: { type: string, format: uuid, nullable: true }
        vendor_id: { type: string, format: uuid, nullable: true }
        entry_type: { type: string }
        ledger_account: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, example: ZMW }
        provider_reference: { type: string }
        created_at: { type: string, format: date-time }
    WalletWithdrawalRequest:
      type: object
      required: [id, wallet_account_id, vendor_id, amount_minor, currency, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        wallet_account_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, example: ZMW }
        status: { type: string, enum: [PENDING_REVIEW, APPROVED, SUBMITTED, PAID, FAILED, CANCELLED, REJECTED] }
        requested_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        failure_reason: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Health:
      type: object
      required: [service, status, database, environment, checked_at]
      properties:
        service: { type: string, example: printa-api }
        status: { type: string, example: online }
        database: { type: string, enum: [connected, unavailable] }
        environment: { type: string, example: development }
        checked_at: { type: string, format: date-time }
    UserRegistration:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string, enum: [VENDOR, STAFF, CASHIER, CUSTOMER] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthToken:
      type: object
      required: [token, token_type]
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
    OTPRequest:
      type: object
      required: [purpose, method]
      properties:
        purpose: { type: string, enum: [LOGIN, REGISTER, PASSWORD_RESET] }
        method: { type: string, enum: [EMAIL, SMS] }
        email: { type: string, format: email }
        phone: { type: string }
        user_id: { type: string, format: uuid }
        password: { type: string, format: password }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string }
    OTPVerify:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, minLength: 4, maxLength: 12 }
    OTPChallenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        method: { type: string }
        destination: { type: string }
        expires_in_seconds: { type: integer }
        delivery_status: { type: string }
    OAuthCallback:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        redirect_uri: { type: string, format: uri }
    VendorOnboard:
      type: object
      required: [business_name, tax_id]
      properties:
        owner_id: { type: string, format: uuid }
        business_name: { type: string }
        tax_id: { type: string }
    CatalogProduct:
      type: object
      required: [name, description, category, base_price, currency, sku]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        base_price: { type: number, format: double, minimum: 0 }
        currency: { type: string, example: ZMW }
        sku: { type: string }
        image_url: { type: string, format: uri }
    Store:
      type: object
      required: [vendor_id, name, description, address, city, country, phone, email]
      properties:
        vendor_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        latitude: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
    DeliveryLocation:
      type: object
      required: [label, recipient_name, recipient_phone, address_line1, city]
      properties:
        label: { type: string, example: Home }
        recipient_name: { type: string, example: Jane Doe }
        recipient_phone: { type: string, example: '0977000000' }
        address_line1: { type: string, example: '1 Example Road' }
        address_line2: { type: string, nullable: true }
        city: { type: string, example: Lusaka }
        country: { type: string, example: Zambia }
        latitude: { type: number, format: double, nullable: true, example: -15.4167 }
        longitude: { type: number, format: double, nullable: true, example: 28.2833 }
        is_default: { type: boolean }
    StoreUpdate:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        description: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string, default: Zambia }
        phone: { type: string }
        email: { type: string, format: email }
        latitude: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
    DeliveryZone:
      type: object
      required: [name, city]
      properties:
        name: { type: string, example: Lusaka Central }
        city: { type: string, example: Lusaka }
        country: { type: string, default: Zambia }
        is_active: { type: boolean, default: true }
    StoreStaffAssignment:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [MANAGER, STAFF, CASHIER], default: STAFF }
    StoreProduct:
      type: object
      required: [store_id, platform_product_id, vendor_price, currency, stock_quantity]
      properties:
        store_id: { type: string, format: uuid }
        platform_product_id: { type: string, format: uuid }
        vendor_price: { type: number, format: double, minimum: 0 }
        currency: { type: string, example: ZMW }
        stock_quantity: { type: integer, minimum: 0 }
    StockUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 0 }
    AvailabilityUpdate:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: number, format: double, minimum: 0 }
        configuration:
          type: object
          additionalProperties: true
    PlaceOrder:
      type: object
      required: [store_id, channel, items]
      properties:
        store_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        channel: { type: string, enum: [ONLINE, POS] }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CartItem' }
        notes: { type: string }
        delivery_address:
          type: object
          additionalProperties: true
        discount: { type: number, format: double, minimum: 0 }
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
    RouteOrder:
      type: object
      required: [order_id]
      properties:
        order_id: { type: string, format: uuid }
    RouteOverride:
      type: object
      required: [store_id, reason]
      properties:
        store_id: { type: string, format: uuid }
        reason: { type: string }
    RoutingRule:
      type: object
      required: [name, rule_type, priority, conditions]
      properties:
        name: { type: string }
        description: { type: string }
        rule_type: { type: string }
        priority: { type: integer, minimum: 0 }
        conditions:
          type: object
          additionalProperties: true
        target_store_id: { type: string, format: uuid }
    ProductionJob:
      type: object
      required: [order_id, store_id]
      properties:
        order_id: { type: string, format: uuid }
        store_id: { type: string, format: uuid }
        assigned_to: { type: string, format: uuid }
        priority: { type: integer, default: 0 }
        notes: { type: string }
        due_at: { type: string, format: date-time }
    ProductionStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        notes: { type: string }
    AssignJob:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
    POSTransaction:
      type: object
      required: [order_id, store_id, amount, payment_method]
      properties:
        order_id: { type: string, format: uuid }
        store_id: { type: string, format: uuid }
        cashier_id: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0 }
        payment_method: { type: string, enum: [CASH, MTN_MOMO, AIRTEL_MONEY, CARD] }
        reference: { type: string }
        change_given: { type: number, format: double, minimum: 0 }
