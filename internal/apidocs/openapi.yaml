openapi: 3.0.3
info:
  title: Printa Ecosystem API
  version: 1.0.0
  description: |
    The Printa Ecosystem API supports vendor onboarding, stores, catalogues, orders,
    routing, production, point of sale, billing, payments, notifications, and external
    communications. All timestamps are RFC 3339 UTC strings and all identifiers are UUIDs
    unless an endpoint documents otherwise.

    Protected endpoints require an `Authorization: Bearer <JWT>` header. Roles are enforced
    by the backend; an operation description identifies any additional role restriction.
  contact:
    name: Printa Engineering
servers:
  - url: /
    description: Current environment
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Users
  - name: Vendors
  - name: Wallets
  - name: Catalog
  - name: Inventory
  - name: Delivery
  - name: Orders
  - name: Routing
  - name: Production
  - name: POS
  - name: Billing
  - name: Payments
  - name: Administration
  - name: Notifications
  - name: Communications
paths:
  /:
    get:
      tags: [System]
      summary: Render API service status
      security: []
      responses:
        '200':
          description: HTML status page
          content:
            text/html:
              schema:
                type: string
  /healthz:
    get:
      tags: [System]
      summary: Check API and database health
      security: []
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/docs:
    get:
      tags: [System]
      summary: Open interactive API reference
      security: []
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
  /api/v1/openapi.yaml:
    get:
      tags: [System]
      summary: Download the OpenAPI contract
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/users/register:
    post:
      tags: [Users]
      summary: Register a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Administrator capability.
      x-required-roles: [ADMIN]
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Users]
      summary: Get a user by identifier
      description: Available to the user themself or an administrator.
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/otp/request:
    post:
      tags: [Authentication]
      summary: Request a one-time password challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
      responses:
        '200':
          description: OTP challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify a one-time password challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
      responses:
        '200':
          description: JWT authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/google/start:
    get:
      tags: [Authentication]
      summary: Begin Google OAuth sign-in
      security: []
      parameters:
        - $ref: '#/components/parameters/RedirectURI'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/OAuthMode'
      responses:
        '302': { description: Redirect to Google authorization }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/google/callback:
    get:
      tags: [Authentication]
      summary: Complete Google OAuth sign-in
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OAuth token and redirect target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCallback'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/vendor/onboard:
    post:
      tags: [Vendors]
      summary: Create or complete a vendor onboarding profile
      description: Vendor callers are bound to their authenticated user ID; administrators may provide `owner_id` when acting on behalf of a user.
      x-required-roles: [VENDOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorOnboard'
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/vendor/profile:
    get:
      tags: [Vendors]
      summary: Get vendor profile
      parameters:
        - name: owner_id
          in: query
          description: Required only for administrators retrieving another user's vendor profile. Ignored for vendor callers.
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vendor/policies/status:
    get:
      tags: [Vendors]
      summary: Get the current vendor policy acceptance status
      description: Returns currently published vendor-required policies and whether the authenticated vendor must accept them before operating protected vendor functions. Draft policies are not acceptible and are not returned as required policies.
      x-required-roles: [VENDOR]
      responses:
        '200':
          description: Current published policy status for the authenticated vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPolicyConsentStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/vendor/policies/accept:
    post:
      tags: [Vendors]
      summary: Affirmatively accept all current required vendor policies
      description: Acceptance is accepted only for the complete set of currently published required policy versions. The server records the authenticated user, version, timestamp, source, user agent, and available request address.
      x-required-roles: [VENDOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorPolicyAcceptanceRequest'
      responses:
        '200':
          description: Acceptance was recorded and the current status is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPolicyConsentStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/vendor/wallet:
    get:
      tags: [Wallets]
      summary: Get the authenticated vendor's Printa Wallet overview
      description: |
        Returns only ledger-derived account, balance, transaction, and withdrawal-request data for the authenticated vendor. It does not activate an account, initiate a deposit or withdrawal, or expose collection-provider details. A vendor without an activated wallet receives an empty overview rather than synthetic balances.
      x-required-roles: [VENDOR]
      responses:
        '200':
          description: Ledger-derived wallet overview; account and balance are absent when the wallet is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletOverview'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/catalog/products:
    get:
      tags: [Catalog]
      summary: List platform print products
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      summary: Create a platform print product
      description: Administrator capability.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogProduct' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/catalog/products/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Catalog]
      summary: Get a platform print product
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      summary: Update a platform print product
      description: Administrator capability.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogProduct' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/inventory/stores:
    get:
      tags: [Inventory]
      summary: List stores
      parameters:
        - name: vendor_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      summary: Create a vendor store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Store' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/inventory/stores/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Inventory]
      summary: Get a store by identifier
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      summary: Update a vendor-owned store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Inventory]
      summary: Deactivate a vendor-owned store
      description: Performs a soft deletion so historical operational records remain available.
      responses:
        '204': { description: Store deactivated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/inventory/stores/{store_id}/staff:
    parameters: [ { $ref: '#/components/parameters/StoreID' } ]
    get:
      tags: [Inventory]
      summary: List store staff
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      summary: Assign a staff member to a store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreStaffAssignment' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/inventory/stores/{store_id}/staff/{user_id}:
    parameters:
      - $ref: '#/components/parameters/StoreID'
      - $ref: '#/components/parameters/UserID'
    delete:
      tags: [Inventory]
      summary: Remove a staff member from a store
      responses:
        '204': { description: Staff member removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/inventory/stores/{store_id}/products:
    parameters: [ { $ref: '#/components/parameters/StoreID' } ]
    get:
      tags: [Inventory]
      summary: List products offered by a store
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inventory]
      summary: Add a platform product to a store catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreProduct' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/inventory/products/{id}/stock:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    patch:
      tags: [Inventory]
      summary: Update store product stock quantity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/inventory/products/{id}/availability:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    patch:
      tags: [Inventory]
      summary: Set store product availability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/inventory/stores/{store_id}/operating-hours:
    parameters: [ { $ref: '#/components/parameters/StoreID' } ]
    get:
      tags: [Inventory]
      summary: List published operating hours for an owned vendor store
      x-required-roles: [VENDOR, ADMIN]
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      summary: Replace the complete seven-day operating-hours schedule for an owned vendor store
      x-required-roles: [VENDOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day_of_week, is_open]
                    properties:
                      day_of_week: { type: integer, minimum: 0, maximum: 6 }
                      is_open: { type: boolean }
                      opens_at: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
                      closes_at: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/submissions/feedback:
    post:
      tags: [Support]
      summary: Submit role-separated customer or vendor feedback
      x-required-roles: [CUSTOMER, VENDOR]
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/submissions/support:
    post:
      tags: [Support]
      summary: Submit role-separated customer or vendor support request
      x-required-roles: [CUSTOMER, VENDOR]
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/submissions/mine:
    get:
      tags: [Support]
      summary: List the authenticated requester’s separated submissions
      x-required-roles: [CUSTOMER, VENDOR]
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/delivery/locations:
    get:
      tags: [Delivery]
      summary: List saved delivery locations for the authenticated customer
      x-required-roles: [CUSTOMER]
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Delivery]
      summary: Create a saved delivery location for the authenticated customer
      x-required-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryLocation' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/delivery/locations/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    patch:
      tags: [Delivery]
      summary: Update an owned saved delivery location
      x-required-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryLocation' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Delivery]
      summary: Delete an owned saved delivery location
      x-required-roles: [CUSTOMER]
      responses:
        '204': { description: Delivery location deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/delivery/locations/{id}/default:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    put:
      tags: [Delivery]
      summary: Set an owned saved delivery location as default
      x-required-roles: [CUSTOMER]
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/delivery/stores/{store_id}/zones:
    parameters: [ { $ref: '#/components/parameters/StoreID' } ]
    get:
      tags: [Delivery]
      summary: List delivery zones for an owned vendor store
      x-required-roles: [VENDOR, ADMIN]
      responses:
        '200': { $ref: '#/components/responses/ArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Delivery]
      summary: Create a city-level delivery zone for an owned vendor store
      x-required-roles: [VENDOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryZone' }
      responses:
        '201': { $ref: '#/components/responses/ObjectCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/delivery/stores/{store_id}/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/StoreID'
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Delivery]
      summary: Update a city-level delivery zone for an owned vendor store
      x-required-roles: [VENDOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryZone' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Delivery]
      summary: Remove a city-level delivery zone for an owned vendor store
      x-required-roles: [VENDOR, ADMIN]
      responses:
        '204': { description: Delivery zone deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/storefront/stores/{store_id}/delivery-eligibility:
